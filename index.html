<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#F5F1EA">
<title>Cercado — o jogo de cercar território</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F1EA; --card:#fff; --ink:#26241F; --muted:#6F6A62; --line:#E4DDD0; --line2:#D3CAB9;
    --p1:#C9573A; --p1d:#94391F; --p1l:#F4D8CE; --p2:#3767A0; --p2d:#22466F; --p2l:#D5E2F2;
    --board:#E8DCC6; --cell:#F8F2E7;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:#E9E3D8;color:var(--ink);font-family:Nunito,system-ui,sans-serif;display:flex;justify-content:center}
  #app{width:100%;max-width:540px;min-height:100vh;background:var(--bg);box-shadow:0 0 0 1px var(--line);position:relative}
  button{font-family:inherit;cursor:pointer;border:none;color:inherit;background:none}
  h1,h2,.disp{font-family:"Baloo 2",Nunito,sans-serif;line-height:1.05}
  .screen{animation:in .25s ease;padding:18px 16px 32px}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .btn{display:block;width:100%;padding:14px;border-radius:14px;font-size:17px;font-weight:900;letter-spacing:.03em;color:#fff;background:var(--ink);box-shadow:0 4px 0 #000;text-align:center}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #000}
  .btn.p1{background:var(--p1);box-shadow:0 4px 0 var(--p1d)} .btn.p2{background:var(--p2);box-shadow:0 4px 0 var(--p2d)}
  .btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line2)}
  .btn:disabled{opacity:.45;cursor:default}
  .stack{display:flex;flex-direction:column;gap:12px}
  .muted{color:var(--muted)}
  .toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:800;z-index:60;animation:in .25s;max-width:90vw;text-align:center}

  /* menu */
  .hero{text-align:center;padding:18px 0 8px}
  .hero h1{font-size:56px;margin:0;letter-spacing:-1px}
  .hero h1 span{color:var(--p1)} .hero h1 i{color:var(--p2);font-style:normal}
  .hero p{margin:4px 0 0;font-weight:800;color:var(--muted)}
  .mini{width:200px;margin:14px auto 18px;display:block}
  .opt{display:flex;align-items:center;gap:14px;background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:14px;text-align:left;width:100%}
  .opt:active{transform:translateY(2px)}
  .opt .e{font-size:28px;width:48px;height:48px;border-radius:14px;background:var(--bg);display:grid;place-items:center;flex:none}
  .opt b{display:block;font-size:17px}.opt span{font-size:13px;color:var(--muted);font-weight:700}
  .seg{display:flex;gap:8px;margin-top:8px}
  .seg button{flex:1;padding:10px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-weight:900}
  .seg button.on{border-color:var(--ink);background:var(--ink);color:#fff}
  .back{font-weight:900;color:var(--muted);padding:6px 0;margin-bottom:6px}
  .rules ol{padding-left:20px;margin:8px 0} .rules li{margin:8px 0;line-height:1.45}
  .rules .box{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin:12px 0}
  .code{font-family:"Baloo 2";font-size:52px;letter-spacing:8px;text-align:center;background:var(--card);border:2px dashed var(--line2);border-radius:18px;padding:10px 0 4px;margin:10px 0}
  .inp{width:100%;font-family:"Baloo 2";font-size:34px;letter-spacing:6px;text-align:center;text-transform:uppercase;padding:10px;border:2px solid var(--line2);border-radius:14px;background:var(--card);color:var(--ink)}
  .linkbox{font-size:13px;word-break:break-all;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--muted);font-weight:700}
  .wait{display:flex;align-items:center;gap:10px;justify-content:center;font-weight:800;color:var(--muted);margin:14px 0}
  .dot3 i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin:0 2px;animation:blink 1.2s infinite}
  .dot3 i:nth-child(2){animation-delay:.2s}.dot3 i:nth-child(3){animation-delay:.4s}
  @keyframes blink{50%{opacity:.2}}

  /* jogo */
  .gtop{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .gtop .t{flex:1;font-family:"Baloo 2";font-size:24px;font-weight:800}
  .icon{width:40px;height:40px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-size:18px;display:grid;place-items:center}
  .players{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .pc{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 10px;display:flex;gap:8px;align-items:center;transition:all .2s}
  .pc .st{width:26px;height:26px;border-radius:50%;flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
  .pc b{display:block;font-size:15px;line-height:1.1}.pc small{font-size:12px;color:var(--muted);font-weight:800}
  .pc.on1{border-color:var(--p1);background:var(--p1l)} .pc.on2{border-color:var(--p2);background:var(--p2l)}
  .pc .hm{margin-left:auto;font-size:16px}.pc .hm.used{opacity:.25;filter:grayscale(1)}
  .hint{margin:12px 0 10px;text-align:center;font-weight:900;font-size:15px;min-height:42px;display:flex;align-items:center;justify-content:center;padding:6px 12px;border-radius:12px;background:var(--card);border:2px solid var(--line)}
  .hint.t1{border-color:var(--p1);color:var(--p1d)} .hint.t2{border-color:var(--p2);color:var(--p2d)}
  .boardwrap{position:relative;width:100%;max-width:460px;margin:0 auto}
  svg.board{width:100%;height:auto;display:block;touch-action:manipulation;user-select:none}
  .cellhit{cursor:pointer}
  .dest{animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.45}}
  .ghost{animation:pulse 1s ease-in-out infinite;cursor:pointer}
  .brk{animation:pulse .8s ease-in-out infinite;cursor:pointer}
  .newwall{animation:grow .35s ease}
  @keyframes grow{from{opacity:0}to{opacity:1}}
  .moved{animation:pop .35s ease;transform-box:fill-box;transform-origin:center}
  @keyframes pop{40%{transform:scale(1.15)}}
  .actions{display:flex;gap:8px;margin-top:12px}
  .actions .btn{padding:12px;font-size:15px}
  .banner{background:#FFF4D6;border:2px solid #E7C66B;border-radius:12px;padding:8px 12px;font-weight:800;font-size:14px;margin-top:10px;text-align:center}
  /* fim */
  .over{position:fixed;inset:0;background:rgba(38,36,31,.45);display:flex;align-items:flex-end;justify-content:center;z-index:40;animation:in .3s}
  .sheet{width:100%;max-width:540px;background:var(--bg);border-radius:22px 22px 0 0;padding:20px 18px 22px;text-align:center}
  .sheet h2{font-size:34px;margin:0}
  .score{display:flex;justify-content:center;align-items:center;gap:16px;margin:12px 0}
  .score div{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:8px 18px;min-width:110px}
  .score b{display:block;font-family:"Baloo 2";font-size:40px;line-height:1}
  .score span{font-weight:800;font-size:13px}
  .confetti{position:fixed;top:-12px;width:9px;height:13px;z-index:50;pointer-events:none;animation:fall linear forwards;border-radius:2px}
  @keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
</style>
</head>
<body>
<div id="app"></div>
<script src="engine.js"></script>
<script>
/* =========================================================
   CERCADO — interface
   ========================================================= */
const C = Cercado, N = C.N;
const app = document.getElementById("app");
const COL = {1:{c:"#C9573A",d:"#94391F",l:"#F4D8CE",name:"Coral"}, 2:{c:"#3767A0",d:"#22466F",l:"#D5E2F2",name:"Azul"}};
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(m){ const t=document.createElement("div"); t.className="toast"; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }
let actx; function tone(fs,vol=.12){ try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); fs.forEach((f,i)=>{ const o=actx.createOscillator(), g=actx.createGain(); o.type="triangle"; o.frequency.value=f; const t=actx.currentTime+i*.08; g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.015); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.connect(g).connect(actx.destination); o.start(t); o.stop(t+.2); }); }catch(e){} }
const sfx = {tap:()=>tone([620],.07), place:()=>tone([440,660]), wall:()=>tone([330,250],.1), brk:()=>tone([200,150,110],.12), win:()=>tone([523,659,784,1046]), bad:()=>tone([220],.08)};
function confetti(){ const cs=[COL[1].c,COL[2].c,"#E7C66B","#26241F"]; for(let i=0;i<70;i++){ const d=document.createElement("div"); d.className="confetti"; d.style.left=Math.random()*100+"vw"; d.style.background=cs[i%4]; d.style.animationDuration=(1.6+Math.random()*1.6)+"s"; d.style.animationDelay=(Math.random()*.4)+"s"; document.body.appendChild(d); setTimeout(()=>d.remove(),3800);} }

/* ---------------- estado da partida ---------------- */
let G=null, MODE=null, LEVEL="normal", ME=null, NAMES={1:"Coral",2:"Azul"};
let sel=null, dest=null, breaking=false, aiTimer=null;
const SAVE="cercado-save";
function save(){ if(MODE==="online") return; try{ if(G && !G.over) localStorage.setItem(SAVE, JSON.stringify({G,MODE,LEVEL,NAMES})); else localStorage.removeItem(SAVE); }catch(e){} }
function loadSave(){ try{ return JSON.parse(localStorage.getItem(SAVE)||"null"); }catch(e){ return null; } }
const myTurn = ()=> G && !G.over && (MODE==="local" || (MODE==="ai" && G.turn===1) || (MODE==="online" && G.turn===ME));

function startGame(mode, opts={}){
  MODE=mode; G=C.newGame({first:opts.first||1}); sel=dest=null; breaking=false;
  if (mode==="local") NAMES={1:"Coral",2:"Azul"};
  if (mode==="ai") NAMES={1:"Você",2:"Computador"};
  save(); game(); maybeAI();
}

/* ---------------- telas ---------------- */
function home(){
  if (NET) netClose();
  const sv=loadSave();
  app.innerHTML=`<div class="screen">
    <div class="hero"><h1>Cerca<span>d</span><i>o</i></h1><p>Mova, levante muros e cerque o maior território.</p></div>
    ${miniBoard()}
    <div class="stack">
      ${sv && sv.G && !sv.G.over ? `<button class="opt" id="cont"><span class="e">▶️</span><div><b>Continuar partida</b><span>${sv.MODE==="ai"?"Contra o computador":"2 jogadores neste aparelho"}</span></div></button>`:""}
      <button class="opt" id="online"><span class="e">🌐</span><div><b>Online com um amigo</b><span>Cada um no seu celular, com código de sala</span></div></button>
      <button class="opt" id="ai"><span class="e">🤖</span><div><b>Contra o computador</b><span>Treine sozinho</span></div></button>
      <button class="opt" id="local"><span class="e">👥</span><div><b>2 jogadores neste aparelho</b><span>Passem o celular a cada jogada</span></div></button>
      <button class="opt" id="how"><span class="e">📖</span><div><b>Como jogar</b><span>Regras em 1 minuto</span></div></button>
    </div></div>`;
  const on=(id,f)=>{ const b=document.getElementById(id); if(b) b.onclick=()=>{ sfx.tap(); f(); }; };
  on("cont",()=>{ G=sv.G; MODE=sv.MODE; LEVEL=sv.LEVEL||"normal"; NAMES=sv.NAMES; sel=dest=null; game(); maybeAI(); });
  on("online",onlineMenu); on("ai",aiMenu); on("local",()=>startGame("local")); on("how",howTo);
}
function miniBoard(){
  return `<svg class="mini" viewBox="0 0 140 140"><rect x="2" y="2" width="136" height="136" rx="14" fill="${"#E8DCC6"}"/>
    ${[...Array(5)].map((_,r)=>[...Array(5)].map((_,c)=>`<rect x="${10+c*24}" y="${10+r*24}" width="22" height="22" rx="4" fill="${(r<2&&c<3)?COL[1].l:(r>2&&c>1)?COL[2].l:"#F8F2E7"}"/>`).join("")).join("")}
    <rect x="9" y="57" width="74" height="5" rx="2.5" fill="${COL[1].c}"/><rect x="81" y="9" width="5" height="50" rx="2.5" fill="${COL[1].c}"/>
    <rect x="57" y="81" width="74" height="5" rx="2.5" fill="${COL[2].c}"/><rect x="57" y="81" width="5" height="50" rx="2.5" fill="${COL[2].c}"/>
    <circle cx="45" cy="21" r="8" fill="${COL[1].c}"/><circle cx="21" cy="45" r="8" fill="${COL[1].c}"/>
    <circle cx="93" cy="117" r="8" fill="${COL[2].c}"/><circle cx="117" cy="93" r="8" fill="${COL[2].c}"/></svg>`;
}
function howTo(){
  app.innerHTML=`<div class="screen rules"><button class="back" id="bk">← Voltar</button><h1 style="font-size:36px;margin:0">Como jogar</h1>
    <div class="box"><b>🎯 Objetivo:</b> no fim, ter mais casas cercadas só com peças suas.</div>
    <ol>
      <li><b>Começo:</b> cada jogador já tem 2 peças no tabuleiro e coloca mais 2 onde quiser (ordem: 1 · 2 · 2 · 1).</li>
      <li><b>Na sua vez:</b> escolha uma peça sua e ande <b>até 2 casas</b> na horizontal ou vertical (pode fazer curva, ou ficar parado). Não dá para atravessar muros nem peças.</li>
      <li><b>Depois de andar, levante um muro</b> em um dos lados livres da casa onde a peça parou. Muros não saem mais.</li>
      <li><b>🔨 Derrubador:</b> uma vez por partida, antes de andar, você pode derrubar um muro que encosta em uma peça sua.</li>
      <li><b>Fim:</b> quando nenhuma área tem peças dos dois jogadores juntas, o jogo acaba. Cada área fechada só com peças suas vale 1 ponto por casa.</li>
      <li><b>Empate:</b> vence quem tiver a maior área única.</li>
    </ol>
    <div class="box">💡 Dica: feche áreas grandes para você e use muros para deixar o adversário preso em espaços pequenos.</div>
    <button class="btn" id="go">Entendi!</button></div>`;
  document.getElementById("bk").onclick=home; document.getElementById("go").onclick=home;
}
function aiMenu(){
  app.innerHTML=`<div class="screen"><button class="back" id="bk">← Voltar</button><h1 style="font-size:36px;margin:0 0 4px">Contra o computador</h1>
    <p class="muted" style="font-weight:700;margin:0 0 14px">Você joga com as peças <b style="color:${COL[1].c}">Coral</b> e começa.</p>
    <b>Nível</b><div class="seg"><button data-l="easy" class="${LEVEL==="easy"?"on":""}">Fácil</button><button data-l="normal" class="${LEVEL==="normal"?"on":""}">Normal</button></div>
    <button class="btn p1" id="go" style="margin-top:18px">Começar</button></div>`;
  document.getElementById("bk").onclick=home;
  app.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{ LEVEL=b.dataset.l; aiMenu(); });
  document.getElementById("go").onclick=()=>startGame("ai");
}

/* ---------------- tabuleiro (SVG) ---------------- */
const CELL=56, PAD=16, SIZE=PAD*2+CELL*N, X=c=>PAD+c*CELL, Y=r=>PAD+r*CELL;
function wallRect(e, fill, extra=""){
  if (e.k==="h") return `<rect ${extra} x="${X(e.c)+3}" y="${Y(e.r+1)-4.5}" width="${CELL-6}" height="9" rx="4.5" fill="${fill}"/>`;
  return `<rect ${extra} x="${X(e.c+1)-4.5}" y="${Y(e.r)+3}" width="9" height="${CELL-6}" rx="4.5" fill="${fill}"/>`;
}
function boardSVG(){
  const regs=C.regions(G), tint=Array.from({length:N},()=>Array(N).fill(0));
  regs.forEach(reg=>{ if(reg.owners.size===1){ const p=[...reg.owners][0]; reg.cells.forEach(([r,c])=>tint[r][c]=p); } });
  const P=[];
  P.push(`<defs>${[1,2].map(p=>`<radialGradient id="sg${p}" cx="38%" cy="32%" r="70%"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".35" stop-color="${COL[p].c}"/><stop offset="1" stop-color="${COL[p].d}"/></radialGradient>`).join("")}</defs>`);
  P.push(`<rect x="2" y="2" width="${SIZE-4}" height="${SIZE-4}" rx="18" fill="#E8DCC6"/>`);
  for (let r=0;r<N;r++) for (let c=0;c<N;c++)
    P.push(`<rect class="cellhit" data-cell="${r},${c}" x="${X(c)+2}" y="${Y(r)+2}" width="${CELL-4}" height="${CELL-4}" rx="7" fill="${tint[r][c]?COL[tint[r][c]].l:"#F8F2E7"}"/>`);
  for (let r=1;r<N;r++) for (let c=1;c<N;c++) P.push(`<rect x="${X(c)-3}" y="${Y(r)-3}" width="6" height="6" rx="1.5" fill="#D6C8B0"/>`);
  // muros
  const L=G.last;
  for (let r=0;r<N-1;r++) for (let c=0;c<N;c++) if (G.h[r][c]) P.push(wallRect({k:"h",r,c}, COL[G.h[r][c]].c, (L&&L.w&&L.w.k==="h"&&L.w.r===r&&L.w.c===c)?'class="newwall"':""));
  for (let r=0;r<N;r++) for (let c=0;c<N-1;c++) if (G.vw[r][c]) P.push(wallRect({k:"v",r,c}, COL[G.vw[r][c]].c, (L&&L.w&&L.w.k==="v"&&L.w.r===r&&L.w.c===c)?'class="newwall"':""));
  const p=G.turn, mine=myTurn();
  // derrubador: muros que podem cair
  if (mine && breaking) C.breakable(G,p).forEach(e=>{ P.push(wallRect(e,"#26241F",`class="brk" data-wall="${e.k},${e.r},${e.c}"`)); P.push(hitEdge(e,`data-wall="${e.k},${e.r},${e.c}"`)); });
  // destinos possíveis
  if (mine && sel!==null && !dest) C.destinations(G,sel).forEach(([r,c])=>{ P.push(`<circle class="dest" cx="${X(c)+CELL/2}" cy="${Y(r)+CELL/2}" r="8" fill="${COL[p].c}" opacity=".55" pointer-events="none"/>`); });
  // peças
  G.stones.forEach((s,i)=>{
    let r=s.r, c=s.c, ghost=false;
    if (mine && dest && i===sel){ r=dest[0]; c=dest[1]; ghost=true; }
    const cx=X(c)+CELL/2, cy=Y(r)+CELL/2, moved=L&&L.t==="move"&&L.s===i, placed=L&&L.t==="place"&&L.r===s.r&&L.c===s.c;
    if (ghost && (s.r!==r || s.c!==c)) P.push(`<circle cx="${X(s.c)+CELL/2}" cy="${Y(s.r)+CELL/2}" r="18" fill="none" stroke="${COL[s.p].c}" stroke-width="2.5" stroke-dasharray="4 4" opacity=".6" pointer-events="none"/>`);
    P.push(`<g ${moved||placed?'class="moved"':""} pointer-events="none"><ellipse cx="${cx}" cy="${cy+15}" rx="15" ry="4" fill="#000" opacity=".12"/>
      <circle cx="${cx}" cy="${cy}" r="18" fill="url(#sg${s.p})" stroke="${COL[s.p].d}" stroke-width="2"/>
      <circle cx="${cx}" cy="${cy}" r="9" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="2"/></g>`);
    if (mine && i===sel) P.push(`<circle cx="${cx}" cy="${cy}" r="24" fill="none" stroke="${COL[s.p].c}" stroke-width="3" pointer-events="none"/>`);
  });
  // lados livres para o muro
  if (mine && dest){
    const s=G.stones[sel], fr=s.r, fc=s.c; s.r=dest[0]; s.c=dest[1];
    const fe=C.freeEdges(G,dest[0],dest[1]); s.r=fr; s.c=fc;
    fe.forEach(e=>{ P.push(wallRect(e, COL[p].c, `class="ghost" opacity=".45" data-edge="${e.k},${e.r},${e.c}"`)); P.push(hitEdge(e,`data-edge="${e.k},${e.r},${e.c}"`)); });
  }
  return `<svg class="board" viewBox="0 0 ${SIZE} ${SIZE}" id="board">${P.join("")}</svg>`;
}
function hitEdge(e, attr){ // área de toque maior para acertar o muro no celular
  if (e.k==="h") return `<rect ${attr} x="${X(e.c)}" y="${Y(e.r+1)-14}" width="${CELL}" height="28" fill="transparent" style="cursor:pointer"/>`;
  return `<rect ${attr} x="${X(e.c+1)-14}" y="${Y(e.r)}" width="28" height="${CELL}" fill="transparent" style="cursor:pointer"/>`;
}

/* ---------------- tela do jogo ---------------- */
function hintText(){
  if (G.over) return "Fim de jogo!";
  const p=G.turn, nm=NAMES[p];
  if (!myTurn()) return MODE==="ai" ? "O computador está pensando…" : MODE==="online" ? "Vez do seu amigo. Aguarde…" : `Vez de ${nm}. Aguarde…`;
  const who = MODE==="local" ? `${nm}: ` : "";
  if (G.phase==="place"){ const left=G.placeOrder.slice(G.placeIdx).filter(x=>x===p).length; const run=G.placeOrder[G.placeIdx+1]===p?" (mais uma depois desta)":""; return `${who}toque numa casa vazia para colocar uma peça${run}`; }
  if (breaking) return `${who}toque no muro que quer derrubar`;
  if (sel===null) return `${who}toque numa peça sua`;
  if (!dest) return `${who}escolha onde parar (até 2 casas) ou toque na própria peça para ficar`;
  return `${who}agora levante um muro num dos lados da peça`;
}
function game(){
  const t=C.territory(G), p=G.turn;
  const pc=q=>`<div class="pc ${!G.over&&G.turn===q?"on"+q:""}"><span class="st" style="background:${COL[q].c}"></span><div><b>${esc(NAMES[q])}</b><small>Área: ${t[q]}</small></div><span class="hm ${G.breaker[q]?"":"used"}" title="Derrubador">🔨</span></div>`;
  const canBreak = myTurn() && G.phase==="play" && G.breaker[p] && !dest && C.breakable(G,p).length>0;
  app.innerHTML=`<div class="screen" style="padding-top:12px">
    <div class="gtop"><button class="icon" id="menu" aria-label="Menu">☰</button><div class="t">${MODE==="online"?"Online":MODE==="ai"?"Contra o computador":"Partida local"}</div>${MODE==="online"?`<span class="muted" style="font-weight:900">Sala ${esc(NET?NET.code:"")}</span>`:""}</div>
    <div class="players">${pc(1)}${pc(2)}</div>
    <div class="hint ${G.over?"":"t"+p}">${esc(hintText())}</div>
    <div class="boardwrap">${boardSVG()}</div>
    ${G.note?`<div class="banner">${esc(G.note)}</div>`:""}
    ${NET && NET.lost ? `<div class="banner">⚠️ Conexão perdida. ${NET.role==="guest"?'<button class="btn ghost" id="recon" style="margin-top:8px;padding:8px">Reconectar</button>':"Aguardando o amigo voltar…"}</div>`:""}
    <div class="actions">
      ${canBreak && !breaking ? `<button class="btn ghost" id="brk">🔨 Derrubar muro</button>`:""}
      ${myTurn() && (sel!==null || breaking) ? `<button class="btn ghost" id="cancel">Cancelar</button>`:""}
      ${G.over ? `<button class="btn p1" id="res">Ver resultado</button>`:""}
    </div></div>`;
  document.getElementById("menu").onclick=()=>{ if (MODE==="online" && !G.over && !confirmLeave()) return; home(); };
  const b=document.getElementById("brk"); if(b) b.onclick=()=>{ breaking=true; sel=dest=null; sfx.tap(); game(); };
  const c=document.getElementById("cancel"); if(c) c.onclick=()=>{ breaking=false; sel=dest=null; game(); };
  const rc=document.getElementById("recon"); if(rc) rc.onclick=()=>joinRoom(NET.code);
  document.getElementById("board").addEventListener("click", onBoard);
  const rs=document.getElementById("res"); if(rs) rs.onclick=()=>{ document.querySelectorAll(".over").forEach(x=>x.remove()); showEnd(); };
  if (G.over) showEnd();
}
let leaveArmed=0;
function confirmLeave(){ if (Date.now()-leaveArmed<3000) return true; leaveArmed=Date.now(); toast("Toque de novo para sair da partida online"); return false; }

function onBoard(ev){
  if (!myTurn()) return;
  const t=ev.target.closest("[data-cell],[data-edge],[data-wall]"); if(!t) return;
  const p=G.turn;
  if (t.dataset.wall){ const [k,r,c]=t.dataset.wall.split(","); act({t:"break",k,r:+r,c:+c}); return; }
  if (t.dataset.edge){ const [k,r,c]=t.dataset.edge.split(","); act({t:"move",s:sel,r:dest[0],c:dest[1],w:{k,r:+r,c:+c}}); return; }
  const [r,c]=t.dataset.cell.split(",").map(Number);
  if (G.phase==="place"){ act({t:"place",r,c}); return; }
  if (breaking){ breaking=false; game(); return; }
  const si=C.stoneAt(G,r,c);
  if (dest){ // trocar o destino ou desistir
    if (sel!==null && C.destinations(G,sel).some(([a,b])=>a===r&&b===c)){ dest=[r,c]; sfx.tap(); }
    else { dest=null; if (si>=0 && G.stones[si].p===p) sel=si; }
    game(); return;
  }
  if (sel!==null && C.destinations(G,sel).some(([a,b])=>a===r&&b===c)){ dest=[r,c]; sfx.tap(); game(); return; }
  if (si>=0 && G.stones[si].p===p){
    if (!C.destinations(G,si).length){ toast("Essa peça não tem para onde ir"); sfx.bad(); return; }
    sel=si; dest=null; sfx.tap(); game(); return;
  }
  sel=null; game();
}
function act(a){
  const err=C.apply(G,a, MODE==="online"?ME:undefined);
  if (err){ toast(err); sfx.bad(); return; }
  ({place:sfx.place, break:sfx.brk, move:sfx.wall})[a.t]();
  sel=null; dest=null; breaking=false;
  save(); if (MODE==="online") netSend({type:"state", G});
  game(); maybeAI();
}
function maybeAI(){
  clearTimeout(aiTimer);
  if (MODE!=="ai" || !G || G.over || G.turn!==2) return;
  aiTimer=setTimeout(()=>{ const m=C.aiMove(G,LEVEL); if(!m) return; C.apply(G,m); ({place:sfx.place, break:sfx.brk, move:sfx.wall})[m.t](); save(); game(); maybeAI(); }, 650);
}
function showEnd(){
  const r=G.result, w=G.winner;
  let title = w===0 ? "Empate!" : MODE==="ai" ? (w===1?"Você venceu!":"O computador venceu") : MODE==="online" ? (w===ME?"Você venceu!":"Seu amigo venceu") : `${NAMES[w]} venceu!`;
  const d=document.createElement("div"); d.className="over";
  d.innerHTML=`<div class="sheet"><h2 style="color:${w?COL[w].d:"var(--ink)"}">${title}</h2>
    <div class="score"><div><b style="color:${COL[1].c}">${r[1]}</b><span>${esc(NAMES[1])}</span></div><div><b style="color:${COL[2].c}">${r[2]}</b><span>${esc(NAMES[2])}</span></div></div>
    <p class="muted" style="font-weight:700;margin:0 0 14px">${r.tiebreak?`Mesma área total: venceu a maior área única (${r.big[w]} casas).`:"Pontos = casas cercadas só com peças de cada jogador."}</p>
    <div class="stack"><button class="btn ${w===2?"p2":"p1"}" id="again">Jogar de novo</button><button class="btn ghost" id="view">Ver tabuleiro</button><button class="btn ghost" id="home">Menu</button></div></div>`;
  document.body.appendChild(d);
  if (!G._celebrated){ G._celebrated=true; if (w===0 || MODE==="local" || (MODE==="ai"&&w===1) || (MODE==="online"&&w===ME)){ sfx.win(); confetti(); } }
  const close=()=>d.remove();
  d.querySelector("#view").onclick=()=>{ close(); };
  d.querySelector("#home").onclick=()=>{ close(); home(); };
  d.querySelector("#again").onclick=()=>{ close(); const first=C.other(G.first||1);
    if (MODE==="online"){ G=C.newGame({first}); sel=dest=null; netSend({type:"state", G}); game(); }
    else startGame(MODE,{first: MODE==="ai"?1:first}); };
  save();
}

/* =========================================================
   ONLINE — sala com código (PeerJS; ?bc=1 usa BroadcastChannel para testes)
   O anfitrião é o Coral (jogador 1); quem entra é o Azul (jogador 2).
   ========================================================= */
let NET=null;
const ALPH="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const genCode=()=>[...Array(5)].map(()=>ALPH[Math.random()*ALPH.length|0]).join("");
const peerId=code=>"cercado-mf-"+code.toLowerCase();
const TEST_BC = new URLSearchParams(location.search).has("bc");
const roomLink=code=>location.origin+location.pathname+location.search+"#sala-"+code;
function loadPeer(){ return new Promise((res,rej)=>{ if(window.Peer) return res(); const s=document.createElement("script"); s.src="peerjs.min.js"; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
function netSend(o){ try{ if(NET && NET.send) NET.send(o); }catch(e){} }
function netClose(){ try{ NET && NET.close && NET.close(); }catch(e){} NET=null; }

function onlineMenu(){
  app.innerHTML=`<div class="screen"><button class="back" id="bk">← Voltar</button><h1 style="font-size:36px;margin:0 0 4px">Online com um amigo</h1>
    <p class="muted" style="font-weight:700;margin:0 0 16px">Cada um joga no seu celular. Um cria a sala e manda o código ou o link para o outro.</p>
    <button class="btn p1" id="create">Criar sala</button>
    <p style="text-align:center;font-weight:900;color:var(--muted);margin:18px 0 8px">ou entre numa sala</p>
    <input class="inp" id="code" maxlength="5" placeholder="CÓDIGO" autocomplete="off" autocapitalize="characters">
    <button class="btn p2" id="join" style="margin-top:10px">Entrar</button></div>`;
  document.getElementById("bk").onclick=home;
  document.getElementById("create").onclick=()=>{ sfx.tap(); createRoom(); };
  const inp=document.getElementById("code");
  inp.oninput=()=>{ inp.value=inp.value.toUpperCase().replace(/[^A-Z0-9]/g,""); };
  document.getElementById("join").onclick=()=>{ const c=inp.value.trim(); if(c.length!==5){ toast("O código tem 5 letras/números"); return; } sfx.tap(); joinRoom(c); };
}
function waitScreen(title, body){ app.innerHTML=`<div class="screen"><button class="back" id="bk">← Cancelar</button><h1 style="font-size:32px;margin:0 0 6px">${title}</h1>${body}</div>`; document.getElementById("bk").onclick=home; }

function lobby(){
  const link=roomLink(NET.code);
  waitScreen("Sala criada!", `<p class="muted" style="font-weight:700;margin:0">Mande este código para o seu amigo:</p>
    <div class="code">${NET.code}</div>
    <div class="linkbox" id="lk">${esc(link)}</div>
    <div class="stack" style="margin-top:12px">
      <button class="btn p1" id="share">Compartilhar link</button>
      <a class="btn ghost" style="text-decoration:none" href="https://wa.me/?text=${encodeURIComponent("Bora jogar Cercado? Entra na minha sala: "+link)}" target="_blank" rel="noopener">Enviar pelo WhatsApp</a>
    </div>
    <div class="wait">Aguardando o amigo entrar <span class="dot3"><i></i><i></i><i></i></span></div>
    <p class="muted" style="font-size:13px;text-align:center;font-weight:700">Deixe esta tela aberta. Você joga com as peças <b style="color:${COL[1].c}">Coral</b>.</p>`);
  document.getElementById("share").onclick=async()=>{
    try{ if (navigator.share){ await navigator.share({title:"Cercado", text:"Entra na minha sala do Cercado:", url:link}); return; } }catch(e){}
    try{ await navigator.clipboard.writeText(link); toast("Link copiado!"); }catch(e){ const r=document.createRange(); r.selectNodeContents(document.getElementById("lk")); getSelection().removeAllRanges(); getSelection().addRange(r); toast("Selecione e copie o link"); }
  };
}

async function createRoom(){
  netClose();
  const code=genCode(); NET={role:"host", code};
  waitScreen("Criando sala…", `<div class="wait">Conectando <span class="dot3"><i></i><i></i><i></i></span></div>`);
  const onConn = (send, close) => {
    NET.send=send; NET.close=close; NET.lost=false; NET.connected=true;
    if (!(MODE==="online" && G && !G.over)){ MODE="online"; ME=1; G=C.newGame(); sel=dest=null; }
    NAMES={1:"Você",2:"Amigo"};
    send({type:"sync", G}); sfx.place(); toast("Seu amigo entrou!"); game();
  };
  if (TEST_BC){
    const ch=new BroadcastChannel("cercado-"+code); NET.close=()=>ch.close();
    ch.onmessage=e=>{ const d=e.data; if(d.type==="join") onConn(o=>ch.postMessage(o),()=>ch.close()); else onData(d); };
    lobby(); return;
  }
  try{ await loadPeer(); }catch(e){ toast("Não foi possível carregar o modo online"); return onlineMenu(); }
  const peer=new Peer(peerId(code),{debug:0}); NET.peer=peer;
  peer.on("open",()=>lobby());
  peer.on("connection",conn=>{
    if (NET.conn && NET.conn.open){ conn.on("open",()=>{ conn.send({type:"full"}); setTimeout(()=>conn.close(),400); }); return; }
    NET.conn=conn;
    conn.on("open",()=>onConn(o=>conn.send(o),()=>{ conn.close(); peer.destroy(); }));
    conn.on("data",onData);
    conn.on("close",()=>{ if(NET && NET.conn===conn){ NET.conn=null; netLost(); } });
  });
  peer.on("disconnected",()=>{ try{ peer.reconnect(); }catch(e){} });
  peer.on("error",e=>{
    if (e.type==="unavailable-id"){ peer.destroy(); return createRoom(); }
    if (NET && NET.connected) return;
    toast("Erro de conexão: verifique a internet"); onlineMenu();
  });
  NET.close=()=>{ try{ peer.destroy(); }catch(e){} };
}

async function joinRoom(code){
  code=code.toUpperCase();
  const keep = NET && NET.role==="guest" && NET.code===code && MODE==="online" && G && !G.over;
  if (!keep) netClose(); else { try{ NET.close&&NET.close(); }catch(e){} }
  NET={role:"guest", code};
  if (!keep) waitScreen("Entrando na sala…", `<div class="code">${esc(code)}</div><div class="wait">Conectando <span class="dot3"><i></i><i></i><i></i></span></div>`);
  if (TEST_BC){
    const ch=new BroadcastChannel("cercado-"+code); NET.send=o=>ch.postMessage(o); NET.close=()=>ch.close();
    ch.onmessage=e=>onData(e.data); ch.postMessage({type:"join"}); return;
  }
  try{ await loadPeer(); }catch(e){ toast("Não foi possível carregar o modo online"); return onlineMenu(); }
  const peer=new Peer({debug:0}); NET.peer=peer; NET.close=()=>{ try{ peer.destroy(); }catch(e){} };
  const timer=setTimeout(()=>{ if(NET && !NET.connected){ toast("Não consegui conectar. Confira o código e a internet."); onlineMenu(); } }, 15000);
  peer.on("open",()=>{
    const conn=peer.connect(peerId(code),{reliable:true}); NET.conn=conn;
    conn.on("open",()=>{ clearTimeout(timer); NET.connected=true; NET.lost=false; NET.send=o=>conn.send(o); });
    conn.on("data",onData);
    conn.on("close",()=>{ if(NET && NET.conn===conn) netLost(); });
  });
  peer.on("error",e=>{ clearTimeout(timer);
    if (e.type==="peer-unavailable"){ toast("Sala não encontrada. Confira o código."); if(!keep) onlineMenu(); else { NET.lost=true; game(); } return; }
    if (!NET || !NET.connected){ toast("Erro de conexão: verifique a internet"); onlineMenu(); }
  });
}
function onData(d){
  if (!d || !d.type) return;
  if (d.type==="full"){ toast("Essa sala já tem dois jogadores."); onlineMenu(); return; }
  if (d.type==="sync" || d.type==="state"){
    const was=G && G.moves, mine=NET && NET.role==="host"?1:2;
    G=d.G; MODE="online"; ME=mine; NAMES={1:mine===1?"Você":"Amigo", 2:mine===2?"Você":"Amigo"};
    sel=dest=null; breaking=false; if (NET){ NET.connected=true; NET.lost=false; }
    if (d.type==="sync") { sfx.place(); }
    else if (G.last) ({place:sfx.place, break:sfx.brk, move:sfx.wall})[G.last.t]();
    document.querySelectorAll(".over").forEach(x=>x.remove());
    game();
  }
}
function netLost(){ if(!NET) return; NET.lost=true; NET.connected=false; if (MODE==="online") game(); else toast("Conexão perdida"); }

/* abrir direto pelo link da sala */
const m=location.hash.match(/^#sala-([A-Z0-9]{5})$/i);
if (m){ history.replaceState(null,"",location.pathname+location.search); joinRoom(m[1]); } else home();
</script>
